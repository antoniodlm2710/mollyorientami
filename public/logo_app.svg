<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Circular White Background with subtle border -->
  <circle cx="120" cy="120" r="115" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3" />
  
  <!-- Red Block 'd' -->
  <g transform="translate(42, 45) rotate(-2)">
    <rect x="0" y="0" width="48" height="52" rx="2" fill="#E11D48" />
    <text x="24" y="42" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="44" fill="#FFFFFF" text-anchor="middle">d</text>
  </g>

  <!-- Yellow/Orange Block 'L' with outline -->
  <g transform="translate(98, 22) rotate(4)">
    <rect x="0" y="0" width="56" height="66" rx="2" fill="#F59E0B" stroke="#94A3B8" stroke-width="1.5" />
    <text x="28" y="54" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle">L</text>
  </g>

  <!-- Blue Block 'M' -->
  <g transform="translate(36, 108) rotate(-10)">
    <rect x="0" y="0" width="56" height="64" rx="2" fill="#1D4ED8" />
    <text x="28" y="52" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle">M</text>
  </g>

  <!-- Text: I.I.S. -->
  <text x="108" y="108" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="16" fill="#1E293B" letter-spacing="0.5">I.I.S.</text>

  <!-- Text: don Lorenzo Milani -->
  <text x="108" y="129" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="19" fill="#DC2626">don</text>
  <text x="108" y="150" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="19" fill="#DC2626">Lorenzo</text>
  <text x="108" y="171" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="19" fill="#DC2626">Milani</text>

  <!-- Text: Gragnano -->
  <text x="114" y="195" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="15" fill="#1E293B">Gragnano</text>
</svg>
